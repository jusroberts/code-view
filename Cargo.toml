[workspace]
resolver = "3"
members = ["crates/protocol", "crates/daemon", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
codeview-protocol = { path = "crates/protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
